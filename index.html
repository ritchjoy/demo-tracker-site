<style>
/* Unlock screen in the Trucker Path dark hero treatment. */
:root {
  color-scheme: dark;
  --hero-from: #0d2340; --hero-to: #000000; --white: #ffffff;
  --on-dark-2: #ffffffb3; --on-dark-3: #ffffff8f; --on-dark-border: #ffffff33; --on-dark-surface: #ffffff14;
  --blue: #1688ca; --blue-strong: #146fa3; --blue-bright: #18acf6; --warn: #ff8a5c;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font: 400 15px/1.5 var(--font); color: var(--white); -webkit-font-smoothing: antialiased;
  background: linear-gradient(125deg, var(--hero-from) 0%, var(--hero-to) 100%);
  display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px));
}
main { width: 100%; max-width: 380px; }
.logo { height: 28px; width: auto; display: block; margin-bottom: 32px; }
h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; }
p { margin: 0 0 24px; color: var(--on-dark-2); }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--on-dark-2); margin-bottom: 8px; }
input[type="password"] {
  width: 100%; font: 400 16px/24px var(--font); color: var(--white); background: var(--on-dark-surface);
  border: 1px solid var(--on-dark-border); border-radius: 4px; padding: 10px 12px;
}
input[type="password"]:focus { outline: 2px solid var(--blue-bright); outline-offset: 1px; border-color: transparent; }
.remember { display: flex; gap: 8px; align-items: center; margin: 14px 0 20px; font-size: 13px; color: var(--on-dark-2); text-transform: none; letter-spacing: 0; font-weight: 400; cursor: pointer; }
.remember input { accent-color: var(--blue-bright); width: 16px; height: 16px; }
button {
  width: 100%; font: 600 15px/22px var(--font); color: var(--white); background: var(--blue); border: 1px solid var(--blue);
  border-radius: 4px; padding: 11px 14px; cursor: pointer; transition: background-color .15s;
}
button:hover { background: var(--blue-strong); }
button:disabled { opacity: .6; cursor: wait; }
button:focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 2px; }
#msg { min-height: 22px; margin-top: 14px; font-size: 13px; color: var(--warn); }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>

  var $ = function (id) { return document.getElementById(id); };
  function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function remembered() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function remember(pw) { try { pw ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {} }

  async function unlock(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
